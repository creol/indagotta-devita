# Deploy on a NAS / any Docker host:
#
#   1. Put your AudD token in a .env file next to this one:
#        AUDD_API_TOKEN=your_token_here
#   2. docker compose up -d --build
#   3. Point nginx Proxy Manager at  http://<host-ip>:8080
#
# The token is read from the environment at run time -- it is never baked into
# the image, so the image is safe to rebuild, copy, or push to a registry.

services:
  singalong:
    build: .
    image: singalong:latest
    container_name: singalong
    restart: unless-stopped
    ports:
      # host:container. 3300 on the host because QNAP's own admin UI already
      # owns 8080 -- publishing there would either fail to bind or shadow the
      # NAS web interface. The container still listens on 8080 internally, so
      # the image stays portable; only the host side is NAS-specific.
      - "3300:8080"
    environment:
      - AUDD_API_TOKEN=${AUDD_API_TOKEN:?set AUDD_API_TOKEN in .env}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
