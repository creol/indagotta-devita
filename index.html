<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- viewport-fit=cover + the safe-area padding in styles.css keeps the UI
         clear of the iPhone notch and home indicator. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <title>Sing Along</title>
    <meta name="description" content="Tap Listen to identify the song playing around you." />

    <!-- ---- PWA ---- -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#4338ca" />

    <!-- iOS does not read the manifest for these, so they are set separately. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sing Along" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
